name: guardian_app
description: A Flutter app for controlling firefighting drone.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.0.5
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.5.1
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^6.2.0
  flutter_foreground_task: ^5.0.4
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^19.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/ 